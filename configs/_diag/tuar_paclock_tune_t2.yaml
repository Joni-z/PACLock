# TUAR enters as the 12th corpus (Mumtaz dropped: saturated at
# 0.95+, zero discriminative power). Same disease as CAUEEG: our
# transplanted 20-epoch recipe vs the winner 50-epoch shape; and
# CBraMod own pretraining gains +0.064 here (small corpus), so the
# ptF arm gets a shot at two lrs.
batch_size: 128
data_root: $PACLOCK_PROC/processed/tuar
dataset: tuar
device: cuda
epochs: 60
eval_every_steps: 0
grad_clip: 1.0
group: C
label_smoothing: 0.1
loss: cross_entropy
lr: 0.0003
max_hours: 22.5
model: paclock
model_kwargs:
  arch: triaxial
  augmentations: []
  band_pe: index
  d_model: 128
  depth: 6
  dropout: 0.2
  freq_mixer: attention
  interaction_mode: rotation
  kernel_size: 201
  n_bands: 8
  n_heads: 4
  pac_patch_len: 50
  pac_token_mode: measured
  patch_len: 50
  spatial_pe: xyz
  tokenizer_mode: duplex
name: tuar-paclock_tune_t2
num_classes: 3
num_workers: 8
optimizer: adamw
patience: 20
sample_rate: 200
scheduler: cosine
seed: 0
weight_decay: 1.0e-05
