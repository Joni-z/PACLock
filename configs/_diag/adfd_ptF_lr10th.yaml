# ADFD is lr-hypersensitive (LaBraM: 1e-4 learns, 2e-4 dead).
# The ptF finetune at the transplanted lr sat at 3-class chance
# for 21 epochs while scratch reaches 0.5617 -- pretrained init
# on this corpus needs a lower lr, same as every other model.
batch_size: 32
checkpoint: pretrain_runs_full/pretrain-duplex_v2_full/checkpoint.pt
checkpoint_exclude:
- frontend.tokenizer
- frontend.phase_tokenizer
- frontend.amplitude_tokenizer
data_root: $PACLOCK_PROC/processed/adfd
dataset: adfd
device: cuda
epochs: 30
eval_every_steps: 200
focal_alpha: 0.25
focal_gamma: 2.0
grad_clip: 1.0
group: pretrain_ft
loss: cross_entropy
lr: 1.0e-05
max_hours: 22.5
model: paclock
model_kwargs:
  arch: triaxial
  augmentations: []
  band_pe: index
  d_model: 128
  depth: 6
  dropout: 0.2
  freq_mixer: attention
  interaction_mode: rotation
  kernel_size: 201
  n_bands: 8
  n_heads: 4
  pac_patch_len: 50
  pac_token_mode: measured
  patch_len: 50
  spatial_pe: xyz
  tokenizer_mode: duplex
name: adfd-paclock_ptF_lr10th
num_classes: 3
num_workers: 8
optimizer: adamw
patience: 20
sample_rate: 200
scheduler: cosine
seed: 0
weight_decay: 1.0e-05
