# TUSZ seizure-TYPE (morphology) task, duplex tokenizer (2026-09-05): same windows/protocol as tusz, label = type.
# Recipe = TUEV-style event classification (CE + label smoothing 0.1, per-epoch eval, 20 epochs).
name: tusz_type-paclock_duplex
group: C
dataset: tusz_type
data_root: $PACLOCK_PROC/processed/tusz_type
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 1.0e-05
scheduler: cosine
grad_clip: 1.0
num_workers: 8
device: cuda
num_classes: 5
epochs: 20
batch_size: 32
eval_every_steps: 0
patience: 20
loss: cross_entropy
sample_rate: 200
val_subsample: 20000
model_kwargs:
  arch: triaxial
  d_model: 128
  depth: 6
  n_bands: 8
  n_heads: 4
  dropout: 0.2
  kernel_size: 201
  patch_len: 50
  augmentations: []
  freq_mixer: attention
  band_pe: index
  tokenizer_mode: duplex
  pac_token_mode: measured
  interaction_mode: rotation
  spatial_pe: xyz
  pac_patch_len: 50
seed: 0
max_hours: 10.0
label_smoothing: 0.1
