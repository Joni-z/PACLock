# raw-token control for the tokenizer ablation (2026-09-04): caueeg_paclock_duplex with the tokenizer
# swapped to raw waveform tokens (tokenizer_mode raw), everything else identical; same construction as tuev_paclock_rawtok.
name: caueeg-paclock_rawtok
group: C
dataset: caueeg
data_root: $PACLOCK_PROC/processed/caueeg
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 1.0e-05
scheduler: cosine
grad_clip: 1.0
num_workers: 8
device: cuda
num_classes: 3
epochs: 20
batch_size: 32
eval_every_steps: 0
patience: 20
loss: cross_entropy
label_smoothing: 0.1
sample_rate: 200
model_kwargs:
  arch: triaxial
  d_model: 128
  depth: 6
  n_bands: 8
  n_heads: 4
  dropout: 0.2
  kernel_size: 201
  patch_len: 50
  augmentations: []
  freq_mixer: attention
  band_pe: index
  tokenizer_mode: raw
  pac_token_mode: measured
  interaction_mode: product
  spatial_pe: xyz
  pac_patch_len: 50
seed: 0
