# Final lr probe: 5e-4, 2e-4, 1e-4 all flat on CAUEEG while scratch
# learns -- if 5e-5 is also flat the failure is not the lr and the
# cell stays empty pending a channel-mapping investigation.
batch_size: 64
data_root: $PACLOCK_PROC/processed/caueeg
dataset: caueeg
device: cuda
epochs: 50
eval_every_steps: 100
grad_clip: null
group: B
label_smoothing: 0.1
layer_decay: 0.65
loader: labram
loss: cross_entropy
lr: 5.0e-05
max_hours: 22.5
model: labram
model_kwargs:
  montage_mode: positional
  target_len: 2000
name: caueeg-labram_pt_lr5e5
num_classes: 3
num_workers: 16
optimizer: adamw
patience: 10
pretrained: true
sample_rate: 200
scheduler: cosine
seed: 0
warmup_epochs: 5
weight_decay: 0.05
