name: tusz-paclock_p200_pt_notok
group: pretrain_ft
dataset: tusz
data_root: $PACLOCK_PROC/processed/tusz
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 1.0e-05
scheduler: cosine
grad_clip: 1.0
num_workers: 8
device: cuda
num_classes: 2
epochs: 20
batch_size: 32
eval_every_steps: 200
patience: 20
loss: bce_with_logits
sample_rate: 200
val_subsample: 20000
model_kwargs:
  arch: triaxial
  d_model: 128
  depth: 6
  n_bands: 8
  n_heads: 4
  dropout: 0.2
  kernel_size: 201
  patch_len: 200
  augmentations: []
  freq_mixer: attention
  band_pe: index
  tokenizer_mode: pac_interaction
  pac_token_mode: measured
  interaction_mode: product
  spatial_pe: xyz
  pac_patch_len: 200
seed: 0
max_hours: 22.5
checkpoint: pretrain_runs_60k/pretrain-size_base/checkpoint.pt
checkpoint_exclude:
  - frontend.phase_tokenizer
  - frontend.amplitude_tokenizer
