name: tuab-labram_pretrained
group: B
dataset: tuab
data_root: $PACLOCK_PROC/processed_labram/tuab
model: labram
loader: labram
pretrained: true
optimizer: adamw
lr: 0.0005
weight_decay: 0.05
epochs: 50
batch_size: 64
warmup_epochs: 5
layer_decay: 0.65
scheduler: cosine
grad_clip: null
patience: 10
num_workers: 16
device: cuda
eval_every_steps: 100
num_classes: 2
sample_rate: 200
loss: bce_with_logits
seed: 0
