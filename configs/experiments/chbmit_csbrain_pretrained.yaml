name: chbmit-csbrain_pretrained
group: B
dataset: chbmit
data_root: $PACLOCK_PROC/processed/chbmit
model: csbrain
pretrained: true
num_classes: 2
sample_rate: 200
loss: bce_with_logits
optimizer: adamw
lr: 0.0001
weight_decay: 0.01
scheduler: cosine
grad_clip: 1.0
epochs: 25
batch_size: 64
patience: 10
eval_every_steps: 500
num_workers: 8
device: cuda
seed: 0
max_hours: 22.5
model_kwargs:
  dropout: 0.1
val_subsample: 20000
recipe_note: epochs 50->25 on the ~300k-window TUH corpora (24h wall on MI210); patience
  10 governs stopping
