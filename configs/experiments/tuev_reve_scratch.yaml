# Group C: REVE architecture trained from scratch (2026-09-10), recipe = reve_pretrained. Single seed (CF1 native row).
name: tuev-reve_scratch
group: C
dataset: tuev
data_root: $PACLOCK_PROC/processed/tuev
model: reve
pretrained: false
num_classes: 6
sample_rate: 200
loss: cross_entropy
optimizer: adamw
lr: 0.0001
weight_decay: 0.01
scheduler: cosine
grad_clip: 1.0
epochs: 30
batch_size: 128
patience: 10
eval_every_steps: 0
num_workers: 8
device: cuda
seed: 0
max_hours: 22.5
model_kwargs:
  dropout: 0.15
label_smoothing: 0.0
