# Portability arm: CBraMod's encoder/head verbatim, its PatchEmbedding
# replaced by CroFreMo's duplex+rotation tokenizer (bands mean-pooled to
# CBraMod's one-token-per-(channel,patch)). Recipe copied from the
# corpus's cbramod_scratch config so the only variable is the tokenizer.
# The claim under test is TFM-Tokenizer's own: the tokenizer carries the
# result across backbones. 2026-09-02.
# ISRUC is a 20-epoch sequence task: batch 64 x 20 windows through the sinc/
# Hilbert frontend OOMs the 64GB MI210 (job 401206). Physical 16 x accum 4
# keeps the effective batch at CBraMod's 64.
accum_steps: 4
batch_size: 16
data_root: $PACLOCK_PROC/processed/isruc
dataset: isruc
device: cuda
epochs: 50
eval_every_steps: 0
grad_clip: 1.0
group: portability
label_smoothing: 0.1
loader: null
loss: cross_entropy
lr: 0.0001
model: cbramod_paclockfe
model_kwargs:
  dropout: 0.1
  interaction_mode: rotation
  tokenizer_mode: duplex
multi_lr: true
name: isruc-cbramod_crofremo
num_classes: 5
num_workers: 16
optimizer: adamw
patience: 0
sample_rate: 200
scheduler: cosine
seed: 0
weight_decay: 0.05
