name: tuar-tfm_scratch
group: C
dataset: tuar
data_root: $PACLOCK_PROC/processed/tuar
model: tfm
loader: tfm
pretrained: false
tfm_setting: multiple
optimizer: adamw
lr: 0.001
weight_decay: 1.0e-05
epochs: 50
batch_size: 512
warmup_epochs: 5
scheduler: cosine
grad_clip: null
patience: 10
num_workers: 16
device: cuda
eval_every_steps: 100
num_classes: 3
loss: cross_entropy
seed: 0
label_smoothing: 0.1
max_hours: 22.5
