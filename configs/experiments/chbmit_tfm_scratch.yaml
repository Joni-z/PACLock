name: chbmit-tfm_scratch
group: C
dataset: chbmit
data_root: $PACLOCK_PROC/processed/chbmit
model: tfm
loader: tfm
pretrained: false
tfm_setting: multiple
optimizer: adamw
lr: 0.001
weight_decay: 1.0e-05
epochs: 7
batch_size: 512
warmup_epochs: 5
label_smoothing: 0.1
scheduler: cosine
grad_clip: null
patience: 10
num_workers: 16
device: cuda
eval_every_steps: 100
num_classes: 2
loss: focal
focal_alpha: 0.25
focal_gamma: 2.0
val_subsample: 20000
seed: 0
