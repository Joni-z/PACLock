dataset: chbmit
data_root: $PACLOCK_PROC/processed/chbmit
num_classes: 2
sample_rate: 200
loss: focal
focal_alpha: 0.25
focal_gamma: 2.0
epochs: 20
batch_size: 512
patience: 8
eval_every_steps: 200
num_workers: 16
device: cuda
name: chbmit-eegnet
group: A
model: eegnet
optimizer: adamw
lr: 0.0003
weight_decay: 1.0e-05
scheduler: cosine
grad_clip: 1.0
seed: 0
max_hours: 22.5
model_kwargs:
  dropout: 0.5
tuned_from:
  grid: lr{1e-3,3e-4} x dropout{0.25,0.5}
  winner: t4
  selected_by: best_val seed0
