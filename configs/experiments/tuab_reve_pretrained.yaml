name: tuab-reve_pretrained
group: B
dataset: tuab
data_root: $PACLOCK_PROC/processed/tuab
model: reve
pretrained: true
num_classes: 2
sample_rate: 200
loss: bce_with_logits
optimizer: adamw
lr: 0.0001
weight_decay: 0.01
scheduler: cosine
grad_clip: 1.0
epochs: 30
batch_size: 128
patience: 10
eval_every_steps: 500
num_workers: 8
device: cuda
seed: 0
max_hours: 22.5
model_kwargs:
  dropout: 0.15
val_subsample: 20000
