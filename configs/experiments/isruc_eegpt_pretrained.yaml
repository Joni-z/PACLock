name: isruc-eegpt_pretrained
group: B
dataset: isruc
data_root: $PACLOCK_PROC/processed/isruc
model: eegpt
loader: default
pretrained: true
sample_rate: 200
optimizer: adamw
weight_decay: 0.01
lr: 0.0004
max_lr: 0.0004
scheduler: onecycle
pct_start: 0.2
batch_size: 32
grad_clip: null
patience: 10
num_workers: 16
device: cuda
eval_every_steps: 0
num_classes: 5
loss: cross_entropy
epochs: 40
flatten_sequences: true
seed: 0
