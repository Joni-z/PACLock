name: tuev-labram_pretrained
group: B
dataset: tuev
data_root: $PACLOCK_PROC/processed_labram/tuev
model: labram
loader: labram
pretrained: true
optimizer: adamw
lr: 0.0005
weight_decay: 0.05
epochs: 50
batch_size: 64
warmup_epochs: 5
layer_decay: 0.65
scheduler: cosine
grad_clip: null
patience: 10
num_workers: 16
device: cuda
eval_every_steps: 100
num_classes: 6
sample_rate: 200
loss: cross_entropy
label_smoothing: 0.1
seed: 0
