name: tuar-eegpt_scratch
group: C
dataset: tuar
data_root: $PACLOCK_PROC/processed/tuar
model: eegpt
loader: default
pretrained: false
sample_rate: 200
optimizer: adamw
weight_decay: 0.01
lr: 0.0004
max_lr: 0.0004
scheduler: onecycle
pct_start: 0.2
batch_size: 32
grad_clip: null
patience: 10
num_workers: 16
device: cuda
eval_every_steps: 200
num_classes: 3
loss: cross_entropy
epochs: 40
seed: 0
label_smoothing: 0.1
max_hours: 22.5
