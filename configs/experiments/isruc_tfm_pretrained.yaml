name: isruc-tfm_pretrained
group: B
dataset: isruc
data_root: $PACLOCK_PROC/processed/isruc
model: tfm
loader: tfm
pretrained: true
tfm_setting: multiple
optimizer: adamw
lr: 0.001
weight_decay: 1.0e-05
epochs: 50
batch_size: 512
warmup_epochs: 5
label_smoothing: 0.1
scheduler: cosine
grad_clip: null
patience: 10
num_workers: 16
device: cuda
eval_every_steps: 0
num_classes: 5
loss: cross_entropy
flatten_sequences: true
seed: 0
