# TUEP v2.0.1 -- epilepsy vs no-epilepsy, recording-level (TUAB's task shape on
# TUSZ's clinical question). No official split: subject-disjoint sorted split,
# stratified by label. Added 2026-08-19 for the 12-corpus downstream slate.
dataset: tuep
version: v2.0.1
raw_root: $PACLOCK_DATA/tuh/tuep
out_dir: $PACLOCK_PROC/processed/tuep
num_classes: 2

sample_rate: 200
band: [0.3, 75.0]
notch: 60.0
window_sec: 10.0
stride_sec: 10.0
drop_tail: true

channels:
  [FP1-F7, F7-T3, T3-T5, T5-O1, FP2-F8, F8-T4, T4-T6, T6-O2,
   FP1-F3, F3-C3, C3-P3, P3-O1, FP2-F4, F4-C4, C4-P4, P4-O2]
channel_ref_suffix: "-REF"
channel_std: "01_tcp_ar"

normalization: div100
loss: bce_with_logits
primary_metric: auroc
report_metrics: [auroc, balanced_acc, pr_auc]

split:
  mode: sort_subject_ratio_stratified
  train_ratio: 0.7
  val_ratio_of_rest: 0.5
