# Coupling-OFF control for the final model at d_model 256 (2026-09-08): identical to v1d256
# except tokenizer_mode raw. This is the attribution row for the main table. Single seed.
name: chbmit-cf2_v1d256raw
group: cf2
dataset: chbmit
data_root: $PACLOCK_PROC/processed/chbmit
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 1.0e-05
scheduler: cosine
grad_clip: 1.0
num_workers: 8
device: cuda
num_classes: 2
epochs: 20
batch_size: 32
eval_every_steps: 200
patience: 20
loss: focal
focal_alpha: 0.25
focal_gamma: 2.0
sample_rate: 200
model_kwargs:
  arch: triaxial
  d_model: 256
  depth: 6
  n_bands: 8
  n_heads: 4
  dropout: 0.2
  kernel_size: 201
  patch_len: 50
  augmentations: []
  freq_mixer: none
  band_pe: index
  tokenizer_mode: raw
  pac_token_mode: measured
  interaction_mode: product
  spatial_pe: xyz
  pac_patch_len: 50
  space_over_bands: true
seed: 0
max_hours: 22.5
