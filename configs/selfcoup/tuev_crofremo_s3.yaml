# Self-inclusive coupling (2026-09-12): band j's aligned phase now includes its OWN phase weighted by the
# within-band coupling Z_jj (phase-amplitude asymmetry = waveform shape). This restores the within-band
# information a coupling-only grid loses -- the reason duplex was adopted -- without doubling the row count,
# and it makes phase-reference invariance hold for every band including the slowest.
# arm s3: tokenizer=pac_interaction n_bands=16
name: tuev-crofremo_s3
group: selfcoup
dataset: tuev
data_root: $PACLOCK_PROC/processed/tuev
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 1.0e-05
scheduler: cosine
grad_clip: 1.0
num_workers: 8
device: cuda
num_classes: 6
epochs: 20
batch_size: 32
eval_every_steps: 0
patience: 20
loss: cross_entropy
label_smoothing: 0.1
sample_rate: 200
model_kwargs:
  arch: triaxial
  d_model: 128
  depth: 6
  n_bands: 16
  n_heads: 4
  dropout: 0.2
  kernel_size: 201
  patch_len: 50
  augmentations: []
  freq_mixer: attention
  band_pe: index
  tokenizer_mode: pac_interaction
  pac_token_mode: measured
  interaction_mode: rotation
  spatial_pe: xyz
  pac_patch_len: 50
  coupling_self: true
seed: 0
coupling_self: true
