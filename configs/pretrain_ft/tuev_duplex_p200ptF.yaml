# patch_len 200 = the PRETRAINING patch. Every previous finetune ran at 50:
# a 1-second-token encoder applied to a 0.25-second grid with the three
# patch-shaped tokenizer convs forced to re-initialise (shape mismatch),
# i.e. pretrained encoder + random tokenizer + foreign grid. This pair
# (scratch@200 vs full-load pretrained@200) is the first clean test of
# whether the pretraining transfers at all. 2026-09-02.
batch_size: 32
checkpoint: pretrain_runs_full/pretrain-duplex_v2_full/checkpoint.pt
data_root: $PACLOCK_PROC/processed/tuev
dataset: tuev
device: cuda
epochs: 20
eval_every_steps: 0
grad_clip: 1.0
group: C
label_smoothing: 0.1
loss: cross_entropy
lr: 0.0001
model: paclock
model_kwargs:
  arch: triaxial
  augmentations: []
  band_pe: index
  d_model: 128
  depth: 6
  dropout: 0.2
  freq_mixer: attention
  interaction_mode: rotation
  kernel_size: 201
  n_bands: 8
  n_heads: 4
  pac_patch_len: 200
  pac_token_mode: measured
  patch_len: 200
  spatial_pe: xyz
  tokenizer_mode: duplex
name: tuev-paclock_duplex_p200ptF
num_classes: 6
num_workers: 8
optimizer: adamw
patience: 20
sample_rate: 200
scheduler: cosine
seed: 0
weight_decay: 1.0e-05
