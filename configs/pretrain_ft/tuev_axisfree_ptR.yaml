# Final axis-free model initialised from its own raw-patch pretraining (150k steps, b2 pool) and finetuned with the
# FROM-SCRATCH recipe (identical to cf2/tuev_cf2_v1d192.yaml except `checkpoint`). Acceptance: no drop where scratch is strong,
# gains where it is weak, corpus by corpus against the three-seed scratch rows. Single seed 0 first.
name: tuev-cf2_v1d192_ptR
group: pretrain_ft
dataset: tuev
data_root: $PACLOCK_PROC/processed/tuev
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 1.0e-05
scheduler: cosine
grad_clip: 1.0
num_workers: 8
device: cuda
num_classes: 6
epochs: 20
batch_size: 32
eval_every_steps: 0
patience: 20
loss: cross_entropy
label_smoothing: 0.1
sample_rate: 200
model_kwargs:
  arch: triaxial
  d_model: 192
  depth: 6
  n_bands: 8
  n_heads: 4
  dropout: 0.2
  kernel_size: 201
  patch_len: 50
  augmentations: []
  freq_mixer: none
  band_pe: index
  tokenizer_mode: duplex
  pac_token_mode: measured
  interaction_mode: rotation
  spatial_pe: xyz
  pac_patch_len: 50
  space_over_bands: true
seed: 0
checkpoint: pretrain_runs_axisfree/pretrain-axisfree_rawpatch_b2/checkpoint.pt
