# ptS (2026-09-03): pretrained row, final recipe (see tuev_duplex_ptS.yaml). Base = tuar ptF_t1 recipe.
batch_size: 64
checkpoint: $PACLOCK_CKPT/pretrain-duplex_v2_60k.pt
data_root: $PACLOCK_PROC/processed/tuar
dataset: tuar
device: cuda
epochs: 50
eval_every_steps: 0
grad_clip: 1.0
group: C
label_smoothing: 0.1
loss: cross_entropy
lr: 0.0005
layer_decay: 0.65
warmup_epochs: 2
freeze_loaded_epochs: 2
max_hours: 22.5
model: paclock
model_kwargs:
  arch: triaxial
  augmentations: []
  band_pe: index
  d_model: 128
  depth: 6
  dropout: 0.2
  freq_mixer: attention
  interaction_mode: rotation
  kernel_size: 201
  n_bands: 8
  n_heads: 4
  pac_patch_len: 50
  pac_token_mode: measured
  patch_len: 50
  spatial_pe: xyz
  tokenizer_mode: duplex
name: tuar-paclock_duplex_ptS
num_classes: 3
num_workers: 8
optimizer: adamw
patience: 20
sample_rate: 200
scheduler: cosine
seed: 0
weight_decay: 0.05
