# Mumtaz is small and near-saturated (top baselines at 0.99); the
# Siena pattern (pretraining decisive on low-label corpora) predicts
# a gain. Scratch recipe + corrected-schedule checkpoint.
batch_size: 32
checkpoint: pretrain_runs_full/pretrain-duplex_v2_full/checkpoint.pt
checkpoint_exclude:
- frontend.tokenizer
- frontend.phase_tokenizer
- frontend.amplitude_tokenizer
data_root: $PACLOCK_PROC/processed/mumtaz
dataset: mumtaz
device: cuda
epochs: 30
eval_every_steps: 200
focal_alpha: 0.25
focal_gamma: 2.0
grad_clip: 1.0
group: C
loss: bce_with_logits
lr: 0.0001
max_hours: 22.5
model: paclock
model_kwargs:
  arch: triaxial
  augmentations: []
  band_pe: index
  d_model: 128
  depth: 6
  dropout: 0.2
  freq_mixer: attention
  interaction_mode: rotation
  kernel_size: 201
  n_bands: 8
  n_heads: 4
  pac_patch_len: 50
  pac_token_mode: measured
  patch_len: 50
  spatial_pe: xyz
  tokenizer_mode: duplex
name: mumtaz-paclock_duplex_ptF
num_classes: 2
num_workers: 8
optimizer: adamw
patience: 20
sample_rate: 200
scheduler: cosine
seed: 0
weight_decay: 1.0e-05
