# FULL checkpoint load: the three tokenizer projections are no longer
# excluded. The exclusion dates from a patch_len-50 pilot (PRETRAIN.md 8)
# and was carried into every pt2/ptF config after patch_len froze at 200,
# so every pretrained finetune so far paired a pretrained encoder with a
# RANDOM tokenizer. Hypothesis: the interface mismatch, not the
# representation, explains pretraining losing to scratch. 2026-09-02.
batch_size: 32
checkpoint: pretrain_runs_full/pretrain-duplex_v2_full/checkpoint.pt
data_root: $PACLOCK_PROC/processed/chbmit
dataset: chbmit
device: cuda
epochs: 20
eval_every_steps: 200
focal_alpha: 0.25
focal_gamma: 2.0
grad_clip: 1.0
group: pretrain_ft
loss: focal
lr: 0.0001
max_hours: 22.5
model: paclock
model_kwargs:
  arch: triaxial
  augmentations: []
  band_pe: index
  d_model: 128
  depth: 6
  dropout: 0.2
  freq_mixer: attention
  interaction_mode: rotation
  kernel_size: 201
  n_bands: 8
  n_heads: 4
  pac_patch_len: 50
  pac_token_mode: measured
  patch_len: 50
  spatial_pe: xyz
  tokenizer_mode: duplex
name: chbmit-paclock_duplex_ptFfull
num_classes: 2
num_workers: 8
optimizer: adamw
patience: 20
sample_rate: 200
scheduler: cosine
seed: 0
weight_decay: 1.0e-05
