# CF1 replacement transplant (2026-09-10): CroFreMo tokenizer in place of LaBraM patch embedding; recipe = labram_scratch
# except batch 16 x accum 4 (= 64): the row-expanded grid (8 rows/electrode) OOMs the 64 GB MI210 at batch 64. Single seed.
name: iiic-labram_crofremo
group: cf1
dataset: iiic
data_root: $PACLOCK_PROC/processed/iiic
model: labram_paclockfe
loader: labram
pretrained: false
optimizer: adamw
lr: 0.0005
weight_decay: 0.05
epochs: 50
batch_size: 16
warmup_epochs: 5
layer_decay: null
scheduler: cosine
grad_clip: null
patience: 10
num_workers: 16
device: cuda
eval_every_steps: 0
num_classes: 6
sample_rate: 200
loss: cross_entropy
seed: 0
label_smoothing: 0.1
model_kwargs:
  montage_mode: positional
  target_len: 2000
  tokenizer_mode: pac_interaction
  interaction_mode: rotation
max_hours: 22.0
accum_steps: 4
