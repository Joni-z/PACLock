# CF1 re-pretraining pair, pool=ds4, 40-epoch budget: CBraMod pretrained BY US (crofremo tokenizer). Single seed.
name: tuev-cbramod_ptc_ds4_ep40
group: cf1
dataset: tuev
data_root: $PACLOCK_PROC/processed/tuev
model: cbramod_paclockfe
loader: null
pretrained: false
optimizer: adamw
lr: 0.0001
weight_decay: 0.05
epochs: 50
batch_size: 64
multi_lr: true
scheduler: cosine
grad_clip: 1.0
patience: 0
num_workers: 16
device: cuda
eval_every_steps: 0
model_kwargs:
  dropout: 0.1
  adapter: replace
  band_mode: channels
  tokenizer_mode: pac_interaction
  interaction_mode: rotation
num_classes: 6
sample_rate: 200
loss: cross_entropy
label_smoothing: 0.1
seed: 0
pretrained_path: pretrain_runs_cbramod/pretrain-cbramod_crofremo_ds4_ep40/checkpoint.pt
max_hours: 22.0
