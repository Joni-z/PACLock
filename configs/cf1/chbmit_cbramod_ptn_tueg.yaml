# CF1 re-pretraining pair, pool=tueg: CBraMod pretrained BY US (native tokenizer), finetuned with the cbramod_pretrained recipe. Single seed.
name: chbmit-cbramod_ptn_tueg
group: cf1
dataset: chbmit
data_root: $PACLOCK_PROC/processed/chbmit
model: cbramod
loader: null
pretrained: false
optimizer: adamw
lr: 0.0001
weight_decay: 0.05
epochs: 50
batch_size: 64
multi_lr: true
scheduler: cosine
grad_clip: 1.0
patience: 0
num_workers: 16
device: cuda
eval_every_steps: 0
model_kwargs:
  dropout: 0.1
num_classes: 2
sample_rate: 200
loss: focal
focal_alpha: 0.25
focal_gamma: 2.0
seed: 0
select_metric: auroc
pretrained_path: pretrain_runs_cbramod/pretrain-cbramod_native_tueg/checkpoint.pt
max_hours: 22.0
