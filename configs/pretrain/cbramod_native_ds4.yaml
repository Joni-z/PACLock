# CBraMod masked-patch pretraining, kind=native, TFM-Tokenizer-style pool (2026-09-10): the TRAIN splits of
# TUAB + TUEV + TUSZ + CHB-MIT (TFM pretrained its hosts on its four downstream sets). One corpus per step, size-weighted.
# Same objective / optimizer / 12k-step budget as the tueg pair, so the two pools are separately paired comparisons.
name: pretrain-cbramod_native_ds4
group: pretrain
kind: native
corpora:
- name: tuab
  data_root: $PACLOCK_PROC/processed/tuab
  flatten_sequences: false
  batch_size: 128
- name: tuev
  data_root: $PACLOCK_PROC/processed/tuev
  flatten_sequences: false
  batch_size: 128
- name: tusz
  data_root: $PACLOCK_PROC/processed/tusz
  flatten_sequences: false
  batch_size: 128
- name: chbmit
  data_root: $PACLOCK_PROC/processed/chbmit
  flatten_sequences: false
  batch_size: 128
model_kwargs: {}
lr: 0.0005
weight_decay: 0.05
eta_min: 1.0e-05
grad_clip: 1.0
mask_ratio: 0.5
steps: 12000
warmup_steps: 300
num_workers: 8
log_every_steps: 100
save_every_steps: 1000
seed: 0
