dataset: chbmit
version: v1.0.0
raw_root: /work1/chenyuyou/yifanwang/data/chbmit
out_dir: /work1/chenyuyou/yifanwang/Zhizhe/processed_pac/chbmit
num_classes: 2
sample_rate: 200
source_rate: 256
window_sec: 10.0
stride_sec: 10.0
drop_tail: true
channels:
- FP1-F7
- F7-T7
- T7-P7
- P7-O1
- FP2-F8
- F8-T8
- T8-P8
- P8-O2
- FP1-F3
- F3-C3
- C3-P3
- P3-O1
- FP2-F4
- F4-C4
- C4-P4
- P4-O2
label_rule: overlap_gt_zero
augment_seizure:
  enabled: true
  pre_sec: 1.0
  post_sec: 1.0
  stride_sec: 5.0
  force_positive: true
normalization: q95
loss: focal
focal_gamma: 2.0
focal_alpha: 0.25
resample_balance: false
primary_metric: pr_auc
report_metrics:
- pr_auc
- balanced_acc
- auroc
split:
  mode: explicit_cases
  train:
  - chb01
  - chb02
  - chb03
  - chb04
  - chb05
  - chb06
  - chb07
  - chb08
  - chb09
  - chb10
  - chb11
  - chb12
  - chb13
  - chb14
  - chb15
  - chb16
  - chb17
  - chb18
  - chb19
  - chb21
  val:
  - chb20
  - chb22
  test:
  - chb23
  - chb24
hp: 0.5
notch: null
_pac_note: 'PAC-methodology variant: band None -> high-pass 0.5 Hz, notch None ->
  none (Kramer et al. 2008: sharp spectral edges generate spurious phase-amplitude
  coupling). Everything else identical to the frozen protocol, so the contrast isolates
  the filtering.'
