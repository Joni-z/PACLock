dataset: sleepedf
version: v1.0.0
subset: sleep-cassette
raw_root: $PACLOCK_DATA/sleep-edf
out_dir: $PACLOCK_PROC/processed_pac/sleepedf
num_classes: 5
sample_rate: 100
resample: false
notch: null
window_sec: 30.0
stride_sec: 30.0
channels:
- EEG Fpz-Cz
- EEG Pz-Oz
label_map:
  Sleep stage W: 0
  Sleep stage 1: 1
  Sleep stage 2: 2
  Sleep stage 3: 3
  Sleep stage 4: 3
  Sleep stage R: 4
drop_labels:
- Movement time
- Sleep stage ?
crop_wake:
  enabled: true
  minutes: 30
normalization: train_stats
loss: cross_entropy
label_smoothing: 0.1
class_weight: null
primary_metric: cohen_kappa
