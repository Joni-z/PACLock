dataset: bci_iv_2a
moabb_name: BNCI2014_001
raw_root: $PACLOCK_DATA/bci-iv-2a
out_dir: $PACLOCK_PROC/processed_pac/bci_iv_2a
num_classes: 4
sample_rate: 200
source_rate: 250
notch: null
n_channels: 22
drop_eog: true
strict_channels: true
trial_sec: 4.0
trial_offset_sec: 0.0
label_map:
  left_hand: 0
  right_hand: 1
  feet: 2
  tongue: 3
normalization: div100
loss: cross_entropy
label_smoothing: 0.1
class_weight: null
primary_metric: balanced_acc
report_metrics:
- balanced_acc
- cohen_kappa
- weighted_f1
split:
  mode: session_run
  train_session: 0train
  test_session: 1test
  train_runs:
  - 0
  - 1
  - 2
  - 3
  - 4
  val_runs:
  - 5
expected:
  trials_per_session: 288
  train_trials_per_subject: 240
  val_trials_per_subject: 48
hp: 0.5
_pac_note: 'PAC-methodology variant: band [0.5, 75.0] -> high-pass 0.5 Hz, notch 50.0
  -> none (Kramer et al. 2008: sharp spectral edges generate spurious phase-amplitude
  coupling). Everything else identical to the frozen protocol, so the contrast isolates
  the filtering.'
