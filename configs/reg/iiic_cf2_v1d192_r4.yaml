# Regularisation arm r4 (2026-09-12): weight_decay 0.05, dropout 0.35 AND augmentation (one of flip / jitter /
# temporal mask / channel mask / frequency mask chosen at random per forward, on the raw signal before the frontend).
# Our runs used no augmentation at all; the ported TeCh recipe always passes such a list.
name: iiic-cf2_v1d192_r4
group: reg
dataset: iiic
data_root: $PACLOCK_PROC/processed/iiic
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 0.05
scheduler: cosine
grad_clip: 1.0
num_workers: 8
device: cuda
num_classes: 6
epochs: 20
batch_size: 32
eval_every_steps: 0
patience: 20
loss: cross_entropy
label_smoothing: 0.1
sample_rate: 200
model_kwargs:
  arch: triaxial
  d_model: 192
  depth: 6
  n_bands: 8
  n_heads: 4
  dropout: 0.35
  kernel_size: 201
  patch_len: 50
  augmentations:
  - flip0.5
  - jitter0.05
  - mask0.2
  - channel0.2
  - frequency0.2
  freq_mixer: none
  band_pe: index
  tokenizer_mode: duplex
  pac_token_mode: measured
  interaction_mode: rotation
  spatial_pe: xyz
  pac_patch_len: 50
  space_over_bands: true
seed: 0
