# Regularisation sweep (2026-09-12): validation peaks at eval 2-13 of 20 and then decays on every corpus where we
# lose, i.e. the model overfits rather than undertrains. Our weight decay was 1e-5 against CBraMod/LaBraM's 0.05.
# r1: weight_decay=0.05. Everything else identical to cf2/iiic_cf2_v1d192.yaml.
name: iiic-cf2_v1d192_r1
group: reg
dataset: iiic
data_root: $PACLOCK_PROC/processed/iiic
model: paclock
optimizer: adamw
lr: 0.0001
weight_decay: 0.05
scheduler: cosine
grad_clip: 1.0
num_workers: 8
device: cuda
num_classes: 6
epochs: 20
batch_size: 32
eval_every_steps: 0
patience: 20
loss: cross_entropy
label_smoothing: 0.1
sample_rate: 200
model_kwargs:
  arch: triaxial
  d_model: 192
  depth: 6
  n_bands: 8
  n_heads: 4
  dropout: 0.2
  kernel_size: 201
  patch_len: 50
  augmentations: []
  freq_mixer: none
  band_pe: index
  tokenizer_mode: duplex
  pac_token_mode: measured
  interaction_mode: rotation
  spatial_pe: xyz
  pac_patch_len: 50
  space_over_bands: true
seed: 0
