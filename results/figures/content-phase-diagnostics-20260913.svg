    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="550.691321" y="55.544" transform="rotate(-0 550.691321 55.544)">TUEV — interim checkpoint</text>
   </g>
  </g>
  <g id="text_36">
   <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start" x="55.44" y="19.461656" transform="rotate(-0 55.44 19.461656)">Sensitivity of the trained f4 model to token interventions</text>
  </g>
  <g id="text_37">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #48535c" x="55.44" y="342.72" transform="rotate(-0 55.44 342.72)">One trained seed per dataset. TUEV uses a saved checkpoint selected at epoch 1; its training was still running.</text>
  </g>
  <g id="text_38">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #48535c" x="55.44" y="360.864" transform="rotate(-0 55.44 360.864)">Shuffle error bars: sample SD across three intervention seeds, not training seeds. All scores use validation data.</text>
  </g>
  <g id="text_39">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #48535c" x="55.44" y="379.008" transform="rotate(-0 55.44 379.008)">Inference-only interventions change model inputs; these are not retrained ablations or causal physiological evidence.</text>
  </g>
 </g>
